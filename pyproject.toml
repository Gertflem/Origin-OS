[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "origin"
version = "0.1.0"
description = "Origin Phase 1 capability-based OS kernel simulation"
requires-python = ">=3.10"

[project.scripts]
origin = "origin.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = [
  "origin",
  "origin.capabilities",
  "origin.core",
  "origin.human",
  "origin.kernel",
  "origin.messages",
  "origin.objects",
  "origin.services",
  "origin.simulator",
  "origin.units",
]
